name: ci

# Checks the vectors are well formed and consistent (tools/check.py): the schema, unique ids,
# known diagnostic codes, interpretation links that resolve, and a case for every tolerance.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: check the vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: pip install jsonschema
      - run: python tools/check.py
